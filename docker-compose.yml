

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/taskmanager_db
    extra_hosts:
      - "host.docker.internal:host-gateway"