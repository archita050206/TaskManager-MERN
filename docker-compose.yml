

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/taskmanager_db
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"