name: MERN Task Manager CI/CD

on:
  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd backend
          rm -rf node_modules
          npm install

      - name: Run Tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/taskmanager_db
        run: |
          cd backend
          npm test

  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t yourdockerhubusername/taskmanager-backend:latest ./backend

      - name: Push Backend Image
        run: |
          docker push yourdockerhubusername/taskmanager-backend:latest

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            cd TaskManager-MERN

            git pull origin main

            docker compose down

            docker pull yourdockerhubusername/taskmanager-backend:latest

            docker compose up -d